<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CalManac — Coursework Tracker</title>
<meta name="description" content="Assignment tracker for Mekila's Fall 2026 classes.">
<meta name="theme-color" content="#161512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #161512;
    --surface: #201e19;
    --surface-2: #29261f;
    --border: #3a362d;
    --text: #f4efe4;
    --text-muted: #a79f8f;
    --gold: #ffaa00;
    --gold-soft: #4a3a17;
    --green: #7c9473;
    --green-soft: #2c3327;
    --rust: #c1502e;
    --rust-soft: #3a231c;
    --radius: 10px;
    --font-display: 'Oswald', 'Arial Narrow', sans-serif;
    --font-body: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }

  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }

  header.top {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 20px 20px 14px;
  }
  .wordmark-row { display: flex; align-items: baseline; justify-content: space-between; }
  .wordmark {
    font-family: var(--font-display); font-weight: 700; font-size: 26px;
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--text);
  }
  .wordmark span { color: var(--gold); }
  .today { font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .stat-strip { margin-top: 10px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
  .stat-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; transition: background .2s; }

  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 14px 20px 4px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-muted); font-size: 13px; font-weight: 500;
    cursor: pointer; white-space: nowrap; transition: background .15s, color .15s, border-color .15s;
    font-family: var(--font-body);
  }
  .tab:hover { border-color: var(--gold); }
  .tab.active { background: var(--gold); border-color: var(--gold); color: #1a1508; font-weight: 600; }

  .list { padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 10px; }
  .section-label { font-size: 12px; color: var(--text-muted); margin: 14px 2px 2px; }

  .card { display: flex; align-items: flex-start; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  .card.completed { opacity: .55; }

  .check {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0;
    margin-top: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    background: transparent; transition: border-color .15s, background .15s; padding: 0;
  }
  .check.done { background: var(--green); border-color: var(--green); }
  .check svg { width: 12px; height: 12px; opacity: 0; color: #14180f; }
  .check.done svg { opacity: 1; }

  .card-body { flex: 1; min-width: 0; cursor: pointer; }
  .card-title { font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.3; }
  .card.completed .card-title { text-decoration: line-through; color: var(--text-muted); }
  .card-meta { margin-top: 3px; font-size: 12.5px; color: var(--text-muted); }
  .card-notes { margin-top: 5px; font-size: 12.5px; color: var(--text-muted); line-height: 1.4; }

  .badge {
    flex-shrink: 0; font-size: 11.5px; font-weight: 600; padding: 4px 8px; border-radius: 6px;
    font-family: var(--font-display); letter-spacing: .02em; white-space: nowrap; margin-top: 1px;
  }
  .badge.urgent { background: var(--rust-soft); color: var(--rust); }
  .badge.soon { background: var(--gold-soft); color: var(--gold); }
  .badge.later { background: var(--surface-2); color: var(--text-muted); }
  .badge.done { background: var(--green-soft); color: var(--green); }

  .empty { text-align: center; padding: 48px 24px; color: var(--text-muted); font-size: 14px; line-height: 1.5; }
  .empty .big { font-family: var(--font-display); font-size: 17px; color: var(--text); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; }

  .fab {
    position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom));
    width: 54px; height: 54px; border-radius: 50%; background: var(--gold); color: #1a1508;
    border: none; font-size: 26px; line-height: 1; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px rgba(0,0,0,.4); cursor: pointer; z-index: 20;
  }
  .fab:hover { filter: brightness(1.06); }

  .fab:focus-visible, .tab:focus-visible, .check:focus-visible, .icon-btn:focus-visible,
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--gold); outline-offset: 2px;
  }

  .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto;
    background: var(--surface); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0;
    padding: 18px 20px calc(20px + env(safe-area-inset-bottom)); z-index: 31;
    transform: translateY(100%); transition: transform .25s ease; max-height: 86vh; overflow-y: auto;
  }
  .sheet.open { transform: translateY(0); }

  .sheet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sheet-title { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .03em; font-size: 16px; }
  .icon-btn { width: 30px; height: 30px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 16px; border-radius: 6px; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-muted); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 11px; color: var(--text); font-family: var(--font-body); font-size: 14px;
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .sheet-actions { display: flex; gap: 10px; margin-top: 6px; }
  .btn { flex: 1; padding: 11px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--font-body); }
  .btn-primary { background: var(--gold); color: #1a1508; }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
  .btn-danger { background: var(--rust-soft); color: var(--rust); }

  @media (prefers-reduced-motion: reduce) {
    .sheet, .sheet-backdrop, .tab, .check, .icon-btn, .fab { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="wordmark-row">
        <div class="wordmark">Cal<span>Manac</span></div>
        <div class="today" id="todayLabel"></div>
      </div>
      <div class="stat-strip"><span class="stat-dot" id="statDot"></span><span id="statLabel">Loading…</span></div>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <main class="list" id="list"></main>

    <button class="fab" id="fabAdd" aria-label="Add assignment">+</button>
  </div>

  <div class="sheet-backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-header">
      <div class="sheet-title" id="sheetTitle">Add assignment</div>
      <button class="icon-btn" id="sheetClose" aria-label="Close">✕</button>
    </div>
    <form id="form">
      <div class="field">
        <label for="fTitle">Title</label>
        <input id="fTitle" required placeholder="Problem Set 3" />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="fClass">Class</label>
          <select id="fClass"></select>
        </div>
        <div class="field">
          <label for="fType">Type</label>
          <select id="fType">
            <option>Homework</option>
            <option>Reading</option>
            <option>Quiz</option>
            <option>Exam</option>
            <option>Project</option>
            <option>Other</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="fDue">Due date</label>
        <input type="date" id="fDue" required />
      </div>
      <div class="field">
        <label for="fNotes">Notes (optional)</label>
        <textarea id="fNotes" placeholder="Anything worth remembering"></textarea>
      </div>
      <div class="sheet-actions">
        <button type="button" class="btn btn-danger" id="deleteBtn" style="display:none;">Delete</button>
        <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>

<script>
  const CLASSES = [
    { id: 'ieor115',    code: 'IEOR 115',    name: 'Database Design' },
    { id: 'engin7',     code: 'ENGIN 7',     name: 'Intro to Programming & Numerical Methods' },
    { id: 'soc111ac',   code: 'SOC 111AC',   name: 'Sociology of the Family' },
    { id: 'indeng174',  code: 'IND ENG 174', name: 'Simulation for Enterprise-Scale Systems' },
  ];

  const STORAGE_KEY = 'calmanac.assignments.v1';
  let assignments = [];
  let activeTab = 'all';
  let editingId = null;

  function loadAssignments() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      assignments = raw ? JSON.parse(raw) : [];
    } catch (e) {
      assignments = [];
    }
  }
  function saveAssignments() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(assignments)); } catch (e) {}
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function classById(id) { return CLASSES.find(c => c.id === id); }

  function daysUntil(dueDateStr) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const due = new Date(dueDateStr + 'T00:00:00');
    return Math.round((due - today) / 86400000);
  }
  function formatDate(dueDateStr) {
    const due = new Date(dueDateStr + 'T00:00:00');
    return due.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  function badgeFor(a) {
    if (a.completed) return { text: 'Done', cls: 'done' };
    const d = daysUntil(a.dueDate);
    if (d < 0) return { text: `${Math.abs(d)}d over`, cls: 'urgent' };
    if (d === 0) return { text: 'Today', cls: 'urgent' };
    if (d === 1) return { text: 'Tomorrow', cls: 'urgent' };
    if (d <= 7) return { text: `${d}d`, cls: 'soon' };
    return { text: `${d}d`, cls: 'later' };
  }

  function checkIconSVG() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  }

  function escapeHTML(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function renderTabs() {
    const tabsEl = document.getElementById('tabs');
    const all = [{ id: 'all', code: 'All' }, ...CLASSES];
    tabsEl.innerHTML = all.map(c => `<button class="tab ${activeTab === c.id ? 'active' : ''}" data-tab="${c.id}">${c.code}</button>`).join('');
    tabsEl.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => { activeTab = btn.dataset.tab; render(); });
    });
  }

  function cardHTML(a) {
    const cls = classById(a.classId);
    const badge = badgeFor(a);
    return `
      <div class="card ${a.completed ? 'completed' : ''}">
        <button class="check ${a.completed ? 'done' : ''}" data-check="${a.id}" aria-label="Toggle complete">${checkIconSVG()}</button>
        <div class="card-body" data-edit="${a.id}">
          <div class="card-title">${escapeHTML(a.title)}</div>
          <div class="card-meta">${cls.code} · ${a.type} · ${formatDate(a.dueDate)}</div>
          ${a.notes ? `<div class="card-notes">${escapeHTML(a.notes)}</div>` : ''}
        </div>
        <div class="badge ${badge.cls}">${badge.text}</div>
      </div>`;
  }

  function render() {
    renderTabs();
    document.getElementById('todayLabel').textContent =
      new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });

    const visible = assignments.filter(a => activeTab === 'all' || a.classId === activeTab);
    const upcoming = visible.filter(a => !a.completed).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
    const done = visible.filter(a => a.completed).sort((a, b) => b.dueDate.localeCompare(a.dueDate));

    const dueSoonCount = assignments.filter(a => !a.completed && daysUntil(a.dueDate) <= 7 && daysUntil(a.dueDate) >= 0).length;
    const overdueCount = assignments.filter(a => !a.completed && daysUntil(a.dueDate) < 0).length;

    const statLabel = document.getElementById('statLabel');
    const statDot = document.getElementById('statDot');
    if (overdueCount > 0) {
      statLabel.textContent = `${overdueCount} overdue, ${dueSoonCount} due this week`;
      statDot.style.background = 'var(--rust)';
    } else if (dueSoonCount > 0) {
      statLabel.textContent = `${dueSoonCount} due this week`;
      statDot.style.background = 'var(--gold)';
    } else {
      statLabel.textContent = 'Nothing due this week';
      statDot.style.background = 'var(--text-muted)';
    }

    const listEl = document.getElementById('list');
    if (visible.length === 0) {
      const label = activeTab === 'all' ? 'your classes' : classById(activeTab).code;
      listEl.innerHTML = `<div class="empty"><div class="big">Nothing tracked yet</div>Tap + to add the first assignment for ${label}.</div>`;
      return;
    }

    let html = upcoming.map(a => cardHTML(a)).join('');
    if (done.length) {
      html += `<div class="section-label">Completed</div>` + done.map(a => cardHTML(a)).join('');
    }
    listEl.innerHTML = html;

    listEl.querySelectorAll('[data-check]').forEach(el => el.addEventListener('click', () => toggleComplete(el.dataset.check)));
    listEl.querySelectorAll('[data-edit]').forEach(el => el.addEventListener('click', () => openForm(el.dataset.edit)));
  }

  function toggleComplete(id) {
    const a = assignments.find(x => x.id === id);
    if (!a) return;
    a.completed = !a.completed;
    saveAssignments();
    render();
  }

  function populateClassSelect() {
    const sel = document.getElementById('fClass');
    sel.innerHTML = CLASSES.map(c => `<option value="${c.id}">${c.code}</option>`).join('');
  }

  function openForm(id) {
    editingId = id || null;
    const sheetTitle = document.getElementById('sheetTitle');
    const deleteBtn = document.getElementById('deleteBtn');
    document.getElementById('form').reset();

    if (editingId) {
      const a = assignments.find(x => x.id === editingId);
      sheetTitle.textContent = 'Edit assignment';
      deleteBtn.style.display = 'block';
      document.getElementById('fTitle').value = a.title;
      document.getElementById('fClass').value = a.classId;
      document.getElementById('fType').value = a.type;
      document.getElementById('fDue').value = a.dueDate;
      document.getElementById('fNotes').value = a.notes || '';
    } else {
      sheetTitle.textContent = 'Add assignment';
      deleteBtn.style.display = 'none';
      document.getElementById('fClass').value = activeTab !== 'all' ? activeTab : CLASSES[0].id;
    }
    document.getElementById('backdrop').classList.add('open');
    document.getElementById('sheet').classList.add('open');
    document.getElementById('fTitle').focus();
  }

  function closeForm() {
    document.getElementById('backdrop').classList.remove('open');
    document.getElementById('sheet').classList.remove('open');
    editingId = null;
  }

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    const title = document.getElementById('fTitle').value.trim();
    const classId = document.getElementById('fClass').value;
    const type = document.getElementById('fType').value;
    const dueDate = document.getElementById('fDue').value;
    const notes = document.getElementById('fNotes').value.trim();
    if (!title || !dueDate) return;

    if (editingId) {
      const a = assignments.find(x => x.id === editingId);
      Object.assign(a, { title, classId, type, dueDate, notes });
    } else {
      assignments.push({ id: uid(), title, classId, type, dueDate, notes, completed: false });
    }
    saveAssignments();
    closeForm();
    render();
  });

  document.getElementById('deleteBtn').addEventListener('click', function () {
    if (!editingId) return;
    assignments = assignments.filter(x => x.id !== editingId);
    saveAssignments();
    closeForm();
    render();
  });

  document.getElementById('cancelBtn').addEventListener('click', closeForm);
  document.getElementById('sheetClose').addEventListener('click', closeForm);
  document.getElementById('backdrop').addEventListener('click', closeForm);
  document.getElementById('fabAdd').addEventListener('click', () => openForm(null));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeForm(); });

  populateClassSelect();
  loadAssignments();
  render();
</script>
</body>
</html>
